<div class="container mt-5">
  <h2>Register</h2>
  <input [(ngModel)]="form.name" placeholder="Name" class="form-control mb-2" />
  <input [(ngModel)]="form.email" placeholder="Email" class="form-control mb-2" />
  <input [(ngModel)]="form.password" type="password" placeholder="Password" class="form-control mb-2" />
  <select [(ngModel)]="form.role" class="form-control mb-2">
    <option value="beneficiary">Beneficiary</option>
    <option value="member">Member</option>
  </select>
  <button (click)="register()" class="btn btn-primary">Register</button>
  <p class="text-danger mt-2">{{ msg }}</p>
</div>
