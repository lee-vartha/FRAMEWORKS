<div class="container mt-5">
  <div class="card p-4 shadow">
    <h2 class="mb-4">🎟 Beneficiary Dashboard</h2>

    <p><strong>Token Balance:</strong> {{ balance }}</p>

    <h4 class="mt-4">Available Products</h4>
    <ul class="list-group mb-3" *ngIf="products.length > 0; else noProducts">
      <li
        class="list-group-item d-flex justify-content-between align-items-center"
        *ngFor="let product of products"
      >
        <span>
          <strong>{{ product.name }}</strong> — {{ product.description }} ({{ product.cost }} tokens)
        </span>
        <button class="btn btn-sm btn-success" (click)="buyProduct(product._id)">
          Buy
        </button>
      </li>
    </ul>

    <ng-template #noProducts>
      <p class="text-muted">No products available yet.</p>
    </ng-template>

    <p class="mt-3 text-info">{{ msg }}</p>
  </div>
</div>
